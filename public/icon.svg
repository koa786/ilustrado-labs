<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark navy background matching website (#0F172A) -->
  <rect width="100" height="100" fill="#0F172A" />
  
  <!-- IlustradoLabs Logo Icon Mark -->
  <g transform="rotate(20 50 50)">
    <!-- Left Pill (Taller, lower, cyan to blue gradient) -->
    <rect
      x="24"
      y="20"
      width="17"
      height="60"
      rx="8.5"
      fill="url(#iconLeftPillGrad)"
    />
    <!-- Right Pill (Shorter, higher, overlapping on top, deep blue to cyan gradient) -->
    <rect
      x="47"
      y="14"
      width="17"
      height="50"
      rx="8.5"
      fill="url(#iconRightPillGrad)"
    />
  </g>

  <defs>
    <linearGradient id="iconLeftPillGrad" x1="32.5" y1="80" x2="32.5" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0044FF" />
    </linearGradient>
    <linearGradient id="iconRightPillGrad" x1="55.5" y1="64" x2="55.5" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0022AA" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
</svg>
